<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dash Closer · Grupo Aventus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0a; --surface:#141414; --surface-2:#1c1c1c; --line:#2a2a2a; --line-2:#222222;
  --ink:#f5f5f5; --ink-2:#b8b8b8; --ink-3:#7d7d7d;
  --accent:#ff6b00; --accent-soft:#2a1606; --accent-ink:#ff8a33; --on-accent:#0a0a0a;
  --good:#3fcf8e; --good-soft:#10261b; --warn:#f2c230; --warn-soft:#2a220a; --bad:#ff4d4d; --bad-soft:#2e1212;
  --black:#e6e6e6; --black-soft:#262626;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.tnum{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:#000;border-bottom:2px solid var(--accent)}
.top-in{max-width:1280px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:16px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:14px}
.brand small{font-weight:500;color:var(--ink-3);font-size:12px;letter-spacing:0}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:13px}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.busy i{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
h3{font-size:14px;font-weight:700}
.sub{color:var(--ink-3);font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:760px){.g2{grid-template-columns:1fr}}
@media (max-width:520px){.g5{grid-template-columns:1fr}.nav a{padding:8px 9px}.brand small{display:none}.sync span{display:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--ink-3);padding:4px 6px;border-radius:6px;font-size:13px}
.icon-btn:hover{background:var(--surface-2);color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.in{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:14px;width:100%;outline:none}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface-2)}
.seg button{border:none;background:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--on-accent)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0;overflow-x:auto}
.tabs a{padding:10px 16px;font-weight:600;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
.tabs a:hover{color:var(--ink)}

/* KPI */
.kpi .lbl{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .foot{font-size:12px;color:var(--ink-3);margin-top:4px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.kpi .badge{white-space:normal;line-height:1.3}
.b-verde{background:var(--good-soft);color:var(--good)}
.b-yellow{background:var(--warn-soft);color:var(--warn)}
.b-red{background:var(--bad-soft);color:var(--bad)}
.b-desligado{background:var(--black-soft);color:var(--black)}
.b-neutro{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.b-aberto{background:var(--accent-soft);color:var(--accent-ink)}

/* Progress */
.prog{position:relative;height:14px;background:var(--line-2);border-radius:999px;margin:34px 0 30px}
.prog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .4s}
.prog .proj{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--ink-2)}
.prog .proj span{position:absolute;top:-22px;left:0;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.prog .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--surface);}
.prog .mk span{position:absolute;top:22px;left:1px;transform:translateX(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap;font-weight:600}

/* Funnel */
.fun{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.fun{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.fun{grid-template-columns:1fr}}
.fstep{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.fstep .t{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:6px}
.fstep .n{font-size:34px;font-weight:800;letter-spacing:-.03em;text-align:center;cursor:text}
.fstep .ctr{display:flex;gap:8px}
.fstep .ctr button{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer;user-select:none}
.fstep .ctr button.plus{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fstep .ctr button:active{transform:scale(.96)}
.fstep .auto{font-size:12px;color:var(--ink-3);text-align:center;height:42px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:10px}
.fbar{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.fbar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.rate{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.rate b{font-size:18px;font-weight:800;display:block}
.rate span{font-size:12px;color:var(--ink-3)}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:800;border-top:1px solid var(--line)}
tr.hl td{background:var(--accent-soft)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

/* Callouts */
.call{border-radius:12px;padding:14px 16px;font-size:13px;border:1px solid transparent}
.call b{font-weight:700}
.c-verde{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 25%,transparent)}
.c-yellow{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.c-red{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.c-desligado{background:var(--black-soft)}
.c-info{background:var(--accent-soft)}

/* Closer cards */
.cc{display:block;transition:transform .15s,border-color .15s}
.cc:hover{border-color:var(--accent);transform:translateY(-2px)}
.cc .av{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
.mini{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden;margin:14px 0 8px}
.mini i{display:block;height:100%;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stats small{display:block;font-size:11px;color:var(--ink-3);font-weight:600}
.stats b{font-size:14px}

/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:600;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw}
.toast.err{background:var(--bad);color:#0a0a0a}
.loading{display:grid;place-items:center;height:60vh;color:var(--ink-3);gap:12px;text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.rules p{margin:6px 0;color:var(--ink-2)}
.rules ul{margin:6px 0 6px 18px;color:var(--ink-2)}
.rules li{margin:4px 0}
.kbd{font-weight:700;color:var(--ink)}
.pill-step{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
.pill-step .num{width:26px;height:26px;flex:none;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:12px}
.muted{color:var(--ink-3)}
.pos{color:var(--good)} .neg{color:var(--bad)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/"><span class="brand-mark">A</span><span>Dash Closer <small>Grupo Aventus</small></span></a>
  <nav class="nav">
    <a href="#/" id="nav-closers">Closers</a>
    <a href="#/config" id="nav-config">Configurações</a>
  </nav>
  <div class="sync" id="sync"><i></i><span>Sincronizado</span></div>
</div></header>
<main class="wrap" id="app"><div class="loading"><div><div class="spin"></div>Carregando dados da planilha…</div></div></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =========================================================
   ESTADO E API
   ========================================================= */
const DB = { closers: [], stages: [], meses: [], vendas: [], descontos: [], taxas: [] };
let pending = 0;

async function api(action, payload) {
  setBusy(1);
  try {
    const r = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, payload }) });
    const j = await r.json().catch(() => ({ ok: false, erro: 'Resposta inválida do servidor' }));
    if (!j.ok) throw new Error(j.erro || 'Erro ao salvar');
    return j.data;
  } finally { setBusy(-1); }
}
function setBusy(d) {
  pending += d;
  const s = document.getElementById('sync');
  s.classList.toggle('busy', pending > 0);
  s.querySelector('span').textContent = pending > 0 ? 'Salvando na planilha…' : 'Sincronizado';
}
async function loadAll() {
  const d = await api('getAll', {});
  Object.assign(DB, d);
}

/* =========================================================
   FORMATAÇÃO
   ========================================================= */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const n = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const brl = v => n(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = v => n(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const pct = (v, d = 1) => n(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const int = v => Math.round(n(v)).toLocaleString('pt-BR');
const dec = (v, d = 1) => n(v).toLocaleString('pt-BR', { maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mesLabel = m => { const [y, mo] = String(m).split('-'); return (MESES[Number(mo) - 1] || m) + '/' + y; };
const dataBR = d => { if (!d) return ''; const [y, m, dd] = String(d).slice(0, 10).split('-'); return `${dd}/${m}/${y}`; };
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const mesAtualISO = () => hojeISO().slice(0, 7);
const proxMes = m => { let [y, mo] = m.split('-').map(Number); mo++; if (mo > 12) { mo = 1; y++; } return `${y}-${String(mo).padStart(2, '0')}`; };
const parseMoney = s => { s = String(s || '').trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return n(parseFloat(s)); };
const initials = nome => String(nome).trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();

/* =========================================================
   REGRAS DE NEGÓCIO
   ========================================================= */
function comissaoPct(ating, p) {
  if (ating < n(p.gatilho)) return 0;
  return n(p.pctBase) + (ating - n(p.gatilho)) * n(p.incremento);
}
function comissaoValor(ating, p) { return n(p.variavel) * comissaoPct(ating, p) / 100; }

function diasDoMes(m) {
  const [y, mo] = m.mes.split('-').map(Number);
  const total = new Date(y, mo, 0).getDate();
  let passados;
  const atual = mesAtualISO();
  if (m.status === 'fechado' || m.mes < atual) passados = total;
  else if (m.mes > atual) passados = 0;
  else passados = new Date().getDate();
  return { total, passados, restantes: Math.max(0, total - passados) };
}

function vendasDoMes(id) { return DB.vendas.filter(v => v.mesId === id).sort((a, b) => String(b.data).localeCompare(String(a.data))); }
function descontosDoMes(id) { return DB.descontos.filter(v => v.mesId === id).sort((a, b) => String(b.data).localeCompare(String(a.data))); }
function mesesDoCloser(cid) { return DB.meses.filter(m => m.closerId === cid).sort((a, b) => a.mes.localeCompare(b.mes)); }

function ticketHistorico(cid) {
  const vs = DB.vendas.filter(v => v.closerId === cid);
  return vs.length ? vs.reduce((s, v) => s + n(v.valorLiquido), 0) / vs.length : 0;
}

function calcMes(m) {
  const vs = vendasDoMes(m.id), ds = descontosDoMes(m.id);
  const fatLiq = vs.reduce((s, v) => s + n(v.valorLiquido), 0);
  const fatBruto = vs.reduce((s, v) => s + n(v.valorBruto), 0);
  const qtd = vs.length;
  const meta = n(m.meta);
  const ating = meta > 0 ? fatLiq / meta * 100 : 0;
  const pctCom = comissaoPct(ating, m);
  const comBruta = comissaoValor(ating, m);
  const desc = ds.reduce((s, d) => s + n(d.valor), 0);
  const comLiq = comBruta - desc;
  const f = { leads: n(m.leads), agendadas: n(m.agendadas), noshow: n(m.noshow), feitas: n(m.feitas), vendas: qtd };
  const tx = {
    agendamento: f.leads ? f.agendadas / f.leads : null,
    noshow: f.agendadas ? f.noshow / f.agendadas : null,
    comparecimento: f.agendadas ? f.feitas / f.agendadas : null,
    fechamento: f.feitas ? f.vendas / f.feitas : null,
    leadVenda: f.leads ? f.vendas / f.leads : null
  };
  const ticket = qtd ? fatLiq / qtd : ticketHistorico(m.closerId);
  const dias = diasDoMes(m);

  // Projeção pelo ritmo atual (dias corridos)
  let proj = null;
  if (m.status === 'aberto' && dias.passados > 0 && dias.passados < dias.total) {
    const fator = dias.total / dias.passados;
    const fatP = fatLiq * fator;
    const atP = meta > 0 ? fatP / meta * 100 : 0;
    proj = {
      fator, fat: fatP, ating: atP, pctCom: comissaoPct(atP, m),
      comissao: comissaoValor(atP, m) - desc,
      funil: { leads: f.leads * fator, agendadas: f.agendadas * fator, noshow: f.noshow * fator, feitas: f.feitas * fator, vendas: f.vendas * fator }
    };
  }

  // O que falta para cada marco
  const marcos = [
    { nome: 'Gatilho da comissão', alvo: n(m.gatilho) },
    { nome: 'Recuperação de flag', alvo: n(m.recuperacao) },
    { nome: 'Meta cheia', alvo: 100 }
  ].filter((x, i, a) => a.findIndex(y => y.alvo === x.alvo) === i).sort((a, b) => a.alvo - b.alvo).map(mk => {
    const valorAlvo = meta * mk.alvo / 100;
    const falta = Math.max(0, valorAlvo - fatLiq);
    const vendasNec = ticket > 0 ? Math.ceil(falta / ticket) : null;
    const feitasNec = vendasNec != null && tx.fechamento ? Math.ceil(vendasNec / tx.fechamento) : null;
    const agendNec = feitasNec != null && tx.comparecimento ? Math.ceil(feitasNec / tx.comparecimento) : null;
    const leadsNec = agendNec != null && tx.agendamento ? Math.ceil(agendNec / tx.agendamento) : null;
    return { ...mk, valorAlvo, falta, porDia: dias.restantes > 0 ? falta / dias.restantes : null, vendasNec, feitasNec, agendNec, leadsNec, comissao: comissaoValor(mk.alvo, m) };
  });

  return { fatLiq, fatBruto, taxasCartao: fatBruto - fatLiq, qtd, meta, ating, pctCom, comBruta, desc, comLiq, remun: n(m.fixo) + comLiq, f, tx, ticket, dias, proj, marcos };
}

/* ---------- Flags ---------- */
const ESTADOS = {
  normal: { nome: 'Sem flag', cls: 'verde' },
  yellowProg: { nome: 'Yellow Flag', cls: 'yellow' },
  red1: { nome: 'Red Flag · aceleração mês 1/2', cls: 'red' },
  red2: { nome: 'Red Flag · aceleração mês 2/2', cls: 'red' },
  desligado: { nome: 'Desligamento', cls: 'desligado' }
};
function avaliar(entrada, a, p) {
  const red = n(p.redAbaixo), yel = n(p.yellowAbaixo), rec = n(p.recuperacao);
  switch (entrada) {
    case 'desligado': return { cls: 'desligado', label: 'Desligamento por baixa performance', next: 'desligado' };
    case 'yellowProg':
      return a >= rec ? { cls: 'verde', label: 'Saiu da Yellow Flag', next: 'normal' }
                      : { cls: 'red', label: `Red Flag (não bateu ${rec}% na Yellow)`, next: 'red1' };
    case 'red1':
      return a >= rec ? { cls: 'red', label: `Aceleração 1/2 cumprida`, next: 'red2' }
                      : { cls: 'desligado', label: 'Desligamento por baixa performance', next: 'desligado' };
    case 'red2':
      return a >= rec ? { cls: 'verde', label: 'Saiu da Red Flag', next: 'normal' }
                      : { cls: 'desligado', label: 'Desligamento por baixa performance', next: 'desligado' };
    default:
      if (a < red) return { cls: 'red', label: 'Red Flag', next: 'red1' };
      if (a < yel) return { cls: 'yellow', label: 'Yellow Flag', next: 'yellowProg' };
      return { cls: 'verde', label: 'Sem flag', next: 'normal' };
  }
}
function linhaDoTempo(cid) {
  let estado = 'normal';
  return mesesDoCloser(cid).map(m => {
    const c = calcMes(m);
    const entrada = estado;
    const aberto = m.status === 'aberto';
    const aAtual = c.ating;
    const aProj = c.proj ? c.proj.ating : c.ating;
    const resultado = avaliar(entrada, aberto ? aProj : aAtual, m);
    const atual = aberto ? avaliar(entrada, aAtual, m) : resultado;
    estado = resultado.next;
    return { m, c, entrada, aberto, resultado, atual };
  });
}
function exigencia(entrada, p) {
  const red = n(p.redAbaixo), yel = n(p.yellowAbaixo), rec = n(p.recuperacao);
  switch (entrada) {
    case 'yellowProg': return `Está em <b>Yellow Flag</b>. Neste mês precisa bater <b>${rec}% da meta</b>. Se não bater, entra em <b>Red Flag</b>.`;
    case 'red1': return `Está em <b>Red Flag</b> (programa de aceleração, <b>mês 1 de 2</b>). Precisa bater <b>${rec}% da meta</b> neste mês e no próximo. Se não bater, é <b>desligado por baixa performance</b>.`;
    case 'red2': return `Está em <b>Red Flag</b> (programa de aceleração, <b>mês 2 de 2</b>). Precisa bater <b>${rec}% da meta</b> neste mês para sair da Red Flag. Se não bater, é <b>desligado por baixa performance</b>.`;
    case 'desligado': return `Não bateu ${rec}% durante o programa de aceleração: <b>desligamento por baixa performance</b>.`;
    default: return `Sem flag. Abaixo de <b>${red}%</b> da meta = Red Flag · entre <b>${red}% e ${yel}%</b> = Yellow Flag · a partir de <b>${yel}%</b> fica sem flag.`;
  }
}
// Mês aberto: mostra a flag em vigor (vinda dos meses anteriores). Mês fechado: o resultado do mês.
function situacaoBadge(it) {
  if (it.aberto) { const e = ESTADOS[it.entrada]; return `<span class="badge b-${e.cls}">${e.nome}</span>`; }
  return `<span class="badge b-${it.resultado.cls}">${esc(it.resultado.label)}</span>`;
}
function corAting(a, p) {
  if (a < n(p.redAbaixo)) return 'var(--bad)';
  if (a < n(p.yellowAbaixo)) return 'var(--warn)';
  return 'var(--good)';
}

   ========================================================= */
let R = {};
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'config') return { page: 'config', tab: parts[1] || 'stages' };
  if (parts[0] === 'closer') return { page: 'closer', cid: parts[1], mid: parts[2], tab: parts[3] || 'painel' };
  return { page: 'home' };
}
function go(h) { location.hash = h; }
window.addEventListener('hashchange', render);

function render() {
  R = parseHash();
  document.getElementById('nav-closers').classList.toggle('on', R.page !== 'config');
  document.getElementById('nav-config').classList.toggle('on', R.page === 'config');
  const app = document.getElementById('app');
  if (R.page === 'config') app.innerHTML = viewConfig();
  else if (R.page === 'closer') app.innerHTML = viewCloser();
  else app.innerHTML = viewHome();
  afterRender();
}

function mesReferencia(cid) {
  const ms = mesesDoCloser(cid);
  return ms.find(m => m.status === 'aberto') || ms[ms.length - 1];
}
function viewHome() {
  const ativos = DB.closers.filter(c => c.ativo !== 'nao');
  const inativos = DB.closers.filter(c => c.ativo === 'nao');
  const cards = ativos.map(cardCloser).join('');
  let totFat = 0, totMeta = 0, totCom = 0;
  ativos.forEach(c => { const m = mesReferencia(c.id); if (m && m.status === 'aberto') { const k = calcMes(m); totFat += k.fatLiq; totMeta += k.meta; totCom += k.comLiq; } });
  return `
  <div class="row between">

  </div>
  ${ativos.length ? `
  <div class="grid g3 mt24">
    <div class="card kpi"><div class="lbl">Faturamento do time (mês aberto)</div><div class="val tnum">${brl0(totFat)}</div><div class="foot">Valor líquido, já sem taxas de cartão</div></div>
    <div class="card kpi"><div class="lbl">Meta somada</div><div class="val tnum">${brl0(totMeta)}</div><div class="foot">${totMeta ? pct(totFat / totMeta * 100) + ' atingido' : '—'}</div></div>
    <div class="card kpi"><div class="lbl">Comissões do mês até agora</div><div class="val tnum">${brl0(totCom)}</div><div class="foot">Já descontados os descontos</div></div>

  <div class="grid g3 mt16">${cards}</div>` : `

    <h2 style="color:var(--ink)">Nenhum closer cadastrado ainda</h2>

}
function cardCloser(c) {

  const k = it.c;

  const flagEntrada = ESTADOS[it.entrada];
  const resultadoTxt = aberto
    ? (k.proj ? `No ritmo atual termina o mês com <b>${pct(k.proj.ating)}</b> → <b>${esc(it.resultado.label)}</b>.` : `Hoje está com <b>${pct(k.ating)}</b> → <b>${esc(it.atual.label)}</b>.`)
    : `Fechou o mês com <b>${pct(k.ating)}</b> → <b>${esc(it.resultado.label)}</b>.`;
  const riscoCls = it.resultado.cls;
  const rs = [[`Red ${n(m.redAbaixo)}%`, n(m.redAbaixo)], [`Gatilho ${n(m.gatilho)}%`, n(m.gatilho)], [`${n(m.recuperacao)}%`, n(m.recuperacao)], ['Meta 100%', 100]];
  const escala = Math.max(120, Math.ceil((Math.max(k.ating, k.proj ? k.proj.ating : 0) + 10) / 10) * 10);

  return `
  <div class="grid g5">

    <div class="card kpi"><div class="lbl">% da meta</div><div class="val tnum" style="color:${corAting(k.ating, m)}">${pct(k.ating)}</div><div class="foot">Meta ${brl0(k.meta)}</div></div>
    <div class="card kpi"><div class="lbl">Comissão do mês</div><div class="val tnum">${brl0(k.comLiq)}</div><div class="foot">${k.pctCom > 0 ? pct(k.pctCom) + ' do variável' : 'Abaixo do gatilho de ' + n(m.gatilho) + '%'}${k.desc > 0 ? ` · −${brl0(k.desc)} descontos` : ''}</div></div>
    <div class="card kpi"><div class="lbl">Remuneração total</div><div class="val tnum">${brl0(k.remun)}</div><div class="foot">Fixo ${brl0(m.fixo)} + comissão</div></div>
    <div class="card kpi"><div class="lbl">Situação</div><div class="val" style="font-size:18px;margin-top:10px">${situacaoBadge(it)}</div><div class="foot">${aberto ? 'Projeção: <b style="color:var(--ink)">' + esc(it.resultado.label) + '</b>' : 'Resultado do mês'}</div></div>

    <div class="prog">
      <div class="fill" style="width:${X(k.ating)}%;background:${corAting(k.ating, m)}"></div>
      ${rs.map(([l, v]) => `<div class="mk" style="left:${X(v)}%"><span>${l}</span></div>`).join('')}
      ${k.proj ? `<div class="proj" style="left:${X(k.proj.ating)}%"><span>Projeção ${pct(k.proj.ating, 0)}</span></div>` : ''}
    </div>
    <div class="call c-${riscoCls}">${exigencia(it.entrada, m)}<br>${resultadoTxt}</div>

  <div class="card mt16">

  </div>
  <div class="card mt16">

function funil(m, k, aberto) {

        ${campo === 'vendas' ? `<div class="auto">Automático pelas vendas cadastradas</div>` :
          `<div class="ctr"><button onclick="bump('${m.id}','${campo}',-1)" aria-label="Diminuir ${nome}">−</button><button class="plus" onclick="bump('${m.id}','${campo}',1)" aria-label="Somar ${nome}">+</button></div>`}

    <div class="rate"><b class="tnum">${r(k.tx.fechamento)}</b><span>Fechamento (vendas ÷ feitas)</span></div>

  </div>`;
}

function projecao(m, k) {

        <div class="rate"><b class="tnum">${brl0(p.comissao)}</b><span>Comissão projetada${p.pctCom ? ' (' + pct(p.pctCom) + ' do variável)' : ''}</span></div>

}

/* ---------- Funil: +/- com gravação agrupada ---------- */
const filaFunil = {};
function bump(mesId, campo, delta) {
  const m = DB.meses.find(x => x.id === mesId);
  if (!m) return;
  const atual = n(m[campo]);
  if (atual + delta < 0) return;
  m[campo] = atual + delta;
  const key = mesId + '|' + campo;
  const q = filaFunil[key] || (filaFunil[key] = { delta: 0, t: null });
  q.delta += delta;
  clearTimeout(q.t);
  q.t = setTimeout(() => enviarFunil(mesId, campo), 700);
  const s = document.getElementById('sync');
  s.classList.add('busy'); s.querySelector('span').textContent = 'Salvando na planilha…';
  render();
}
async function enviarFunil(mesId, campo) {
  const key = mesId + '|' + campo;
  const q = filaFunil[key];
  if (!q || !q.delta) { setBusy(0); return; }
  const delta = q.delta; q.delta = 0;
  try {
    const srv = await api('incFunnel', { mesId, campo, delta });
    const m = DB.meses.find(x => x.id === mesId);
    if (m && !filaFunil[key].delta) { m[campo] = n(srv[campo]); render(); }
  } catch (e) {
    const m = DB.meses.find(x => x.id === mesId);
    if (m) m[campo] = Math.max(0, n(m[campo]) - delta);
    toast('Não foi possível salvar o funil: ' + e.message, true);
    render();
  }
}
function editarFunil(mesId, campo) {
  const m = DB.meses.find(x => x.id === mesId);
  const nomes = { leads: 'Leads', agendadas: 'Reuniões agendadas', noshow: 'No-show', feitas: 'Reuniões feitas' };
  openModal(`<h2>${nomes[campo]}</h2>

        <td class="r tnum">${brl0(t.c.comBruta)}</td><td class="r tnum">${t.c.desc ? '−' + brl0(t.c.desc) : '—'}</td><td class="r tnum"><b>${brl0(t.c.remun)}</b></td>
        <td><span class="badge b-${t.aberto ? t.atual.cls : t.resultado.cls}">${esc(t.aberto ? t.atual.label + ' (parcial)' : t.resultado.label)}</span></td></tr>`).join('')}</tbody>

    </table></div>
  </div>`;

function graficoHistorico(tl) {
  const W = 900, H = 260, pl = 44, pr = 10, pt = 16, pb = 36;
  const maxA = Math.max(120, ...tl.map(t => t.c.ating + 10));
  const top = Math.ceil(maxA / 20) * 20;
  const iw = W - pl - pr, ih = H - pt - pb;
  const bw = Math.min(56, iw / tl.length * 0.6);
  const y = v => pt + ih - (Math.min(v, top) / top) * ih;
  const p0 = tl[tl.length - 1].m;
  const refs = [[n(p0.redAbaixo), 'var(--bad)'], [n(p0.yellowAbaixo), 'var(--warn)'], [100, 'var(--ink-3)']];
  let grid = '';
  for (let v = 0; v <= top; v += 20) grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v}%</text>`;
  const bars = tl.map((t, i) => {
    const cx = pl + iw / tl.length * (i + 0.5);
    const a = t.c.ating, h = Math.max(0, y(0) - y(a));
    const cor = corAting(a, t.m);
    const r = Math.min(4, h);
    const x0 = cx - bw / 2, yTop = y(a);
    const path = h > 0 ? `M${x0},${y(0)} V${yTop + r} Q${x0},${yTop} ${x0 + r},${yTop} H${x0 + bw - r} Q${x0 + bw},${yTop} ${x0 + bw},${yTop + r} V${y(0)} Z` : '';
    const tip = `${mesLabel(t.m.mes)}|${pct(a)} da meta|${brl0(t.c.fatLiq)} faturado|Comissão ${brl0(t.c.comLiq)}|${t.aberto ? t.atual.label + ' (parcial)' : t.resultado.label}`;
    return `<g class="hb" data-tip="${esc(tip)}" data-x="${cx}" data-y="${yTop}">
      <rect x="${cx - iw / tl.length / 2}" y="${pt}" width="${iw / tl.length}" height="${ih}" fill="transparent"/>
      ${path ? `<path d="${path}" fill="${cor}" ${t.aberto ? 'fill-opacity=".55"' : ''}/>` : ''}
      <text x="${cx}" y="${H - pb + 18}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${MESES[Number(t.m.mes.slice(5)) - 1].slice(0, 3)}/${t.m.mes.slice(2, 4)}</text>
      ${tl.length <= 12 ? `<text x="${cx}" y="${yTop - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${pct(a, 0)}</text>` : ''}
    </g>`;
  }).join('');
  const lines = refs.map(([v, c]) => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="5 4"/>`).join('');
  return `<div class="chart" id="hchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Percentual da meta por mês">${grid}${lines}${bars}<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/></svg><div class="tip" id="htip" style="display:none"></div></div>
  <div class="legend"><span><i style="background:var(--good)"></i>Sem flag (≥ ${n(p0.yellowAbaixo)}%)</span><span><i style="background:var(--warn)"></i>Yellow (${n(p0.redAbaixo)}–${n(p0.yellowAbaixo)}%)</span><span><i style="background:var(--bad)"></i>Red (&lt; ${n(p0.redAbaixo)}%)</span><span><i style="background:var(--good);opacity:.55"></i>Mês aberto (parcial)</span></div>`;
}
function ligarTooltip() {
  const ch = document.getElementById('hchart'); if (!ch) return;
  const tip = document.getElementById('htip'), svg = ch.querySelector('svg');
  ch.querySelectorAll('.hb').forEach(g => {
    g.addEventListener('mouseenter', () => {
      const parts = g.dataset.tip.split('|');
      tip.innerHTML = `<b>${esc(parts[0])}</b><br>${parts.slice(1).map(esc).join('<br>')}`;
      const s = svg.getBoundingClientRect().width / 900;
      tip.style.left = (n(g.dataset.x) * s) + 'px'; tip.style.top = (n(g.dataset.y) * s) + 'px'; tip.style.display = 'block';
    });
    g.addEventListener('mouseleave', () => tip.style.display = 'none');
  });
}

function modalStage(id) {
  const s = DB.stages.find(x => x.id === id) || { nome: '', fixo: 2000, variavel: 4000, meta: 30000, gatilho: 60, pctBase: 40, incremento: 1.5, redAbaixo: 40, yellowAbaixo: 60, recuperacao: 85 };
  const f = (k, l, extra = '') => `<label class="f">${l}<input class="in" id="s-${k}" type="number" step="any" value="${s[k]}" ${extra}></label>`;
  openModal(`<h2>${id ? 'Editar stage' : 'Novo stage'}</h2>
    <label class="f">Nome<input class="in" id="s-nome" value="${esc(s.nome)}" placeholder="Ex.: Stage 2"></label>
    <h3 class="mt16">Remuneração</h3>
    <div class="form-grid mt8">${f('fixo', 'Fixo (R$)')}${f('variavel', 'Variável (R$)')}${f('meta', 'Meta padrão (R$)')}</div>
    <h3 class="mt16">Faixa de comissionamento</h3>
    <div class="form-grid mt8">${f('gatilho', 'Gatilho (% da meta)')}${f('pctBase', '% do variável no gatilho')}${f('incremento', 'p.p. por ponto acima')}</div>
    <h3 class="mt16">Flags</h3>
    <div class="form-grid mt8">${f('redAbaixo', 'Red abaixo de (%)')}${f('yellowAbaixo', 'Yellow abaixo de (%)')}${f('recuperacao', 'Recuperação (%)')}</div>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Salvar stage</button></div>`,
    async () => {
      const p = { id, nome: document.getElementById('s-nome').value.trim() };
      ['fixo', 'variavel', 'meta', 'gatilho', 'pctBase', 'incremento', 'redAbaixo', 'yellowAbaixo', 'recuperacao'].forEach(k => p[k] = n(document.getElementById('s-' + k).value));
      if (!p.nome) throw new Error('Informe o nome');
      const srv = await api('saveStage', p);
      const i = DB.stages.findIndex(x => x.id === srv.id);
      if (i >= 0) DB.stages[i] = srv; else DB.stages.push(srv);
    });
}
async function excluirStage(id) {
  if (!confirmar('Excluir este stage?')) return;
  try { await api('deleteStage', { id }); DB.stages = DB.stages.filter(s => s.id !== id); render(); } catch (e) { toast(e.message, true); }
}
function cfgTaxas() {
  const lista = Array.from({ length: 12 }, (_, i) => i + 1);
  return `<div class="card" style="max-width:720px">
    <div class="card-h"><h2>Taxas do cartão por parcelamento</h2></div>
    <p class="sub">Percentual descontado do valor da venda no cartão. Vale para as próximas vendas cadastradas; vendas já cadastradas mantêm a taxa da época.</p>
    <div class="form-grid mt16" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
      ${lista.map(p => `<label class="f">${p}x (%)<input class="in tx-in" data-p="${p}" type="number" step="0.01" min="0" value="${taxaDe(p)}"></label>`).join('')}
    </div>
    <div class="row mt16" style="justify-content:flex-end"><button class="btn pri" onclick="salvarTaxas()">Salvar taxas</button></div>
  </div>`;
}
async function salvarTaxas() {
  const taxas = [...document.querySelectorAll('.tx-in')].map(i => ({ parcelas: n(i.dataset.p), taxa: n(i.value) }));
  try { DB.taxas = await api('saveTaxas', { taxas }); toast('Taxas salvas'); render(); } catch (e) { toast(e.message, true); }
}
function cfgClosers() {
  return `<div class="row between"><p class="sub">Renomear, inativar ou excluir closers.</p><button class="btn pri" onclick="modalNovoCloser()">+ Novo closer</button></div>
  <div class="card mt16">${DB.closers.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>Nome</th><th>Status</th><th class="r">Meses</th><th></th></tr></thead>
    <tbody>${DB.closers.map(c => `<tr><td><b>${esc(c.nome)}</b></td><td>${c.ativo === 'nao' ? '<span class="badge b-neutro">Inativo</span>' : '<span class="badge b-verde">Ativo</span>'}</td>
      <td class="r tnum">${mesesDoCloser(c.id).length}</td>
      <td class="r"><div class="row" style="gap:4px;justify-content:flex-end">
        <button class="btn sm" onclick="renomearCloser('${c.id}')">Renomear</button>
        <button class="btn sm" onclick="toggleCloser('${c.id}')">${c.ativo === 'nao' ? 'Reativar' : 'Inativar'}</button>
        <button class="btn sm danger" onclick="excluirCloser('${c.id}')">Excluir</button></div></td></tr>`).join('')}</tbody>
  </table></div>` : '<div class="empty">Nenhum closer.</div>'}</div>`;
}
function renomearCloser(id) {
  const c = DB.closers.find(x => x.id === id);
  openModal(`<h2>Renomear closer</h2><label class="f">Nome<input class="in" id="c-nome" value="${esc(c.nome)}"></label>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`,
    async () => { const srv = await api('updateCloser', { id, nome: document.getElementById('c-nome').value }); Object.assign(c, srv); });
}
async function toggleCloser(id) {
  const c = DB.closers.find(x => x.id === id);
  try { const srv = await api('updateCloser', { id, ativo: c.ativo === 'nao' ? 'sim' : 'nao' }); Object.assign(c, srv); render(); } catch (e) { toast(e.message, true); }
}
async function excluirCloser(id) {
  const c = DB.closers.find(x => x.id === id);
  if (!confirmar(`Excluir ${c.nome} e TODOS os meses, vendas e descontos dele? Isso não pode ser desfeito. Para só esconder, use "Inativar".`)) return;
  try {
    await api('deleteCloser', { id });
    DB.closers = DB.closers.filter(x => x.id !== id); DB.meses = DB.meses.filter(x => x.closerId !== id);
    DB.vendas = DB.vendas.filter(x => x.closerId !== id); DB.descontos = DB.descontos.filter(x => x.closerId !== id);
    toast('Closer excluído'); render();
  } catch (e) { toast(e.message, true); }
}

/* =========================================================
   MODAIS: closer e meses
   ========================================================= */
function stageOptions(sel) { return DB.stages.map(s => `<option value="${s.id}" data-meta="${n(s.meta)}" ${s.id === sel ? 'selected' : ''}>${esc(s.nome)} · meta ${brl0(s.meta)}</option>`).join(''); }
function syncMeta() { const o = document.getElementById('m-stage').selectedOptions[0]; if (o) document.getElementById('m-meta').value = o.dataset.meta; }

function modalNovoCloser() {
  if (!DB.stages.length) return toast('Cadastre um stage primeiro em Configurações', true);
  const s0 = DB.stages[0];
  openModal(`<h2>Novo closer</h2>
    <label class="f">Nome<input class="in" id="c-nome" placeholder="Nome do closer"></label>
    <div class="form-grid mt16">
      <label class="f">Mês inicial<input class="in" id="m-mes" type="month" value="${mesAtualISO()}"></label>
      <label class="f">Stage<select class="in" id="m-stage" onchange="syncMeta()">${stageOptions(s0.id)}</select></label>
    </div>
    <label class="f mt16">Meta do mês (R$)<input class="in" id="m-meta" type="number" step="any" value="${n(s0.meta)}"></label>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Cadastrar</button></div>`,
    async () => {
      const nome = document.getElementById('c-nome').value.trim();
      if (!nome) throw new Error('Informe o nome');
      const r = await api('createCloser', { nome, mes: document.getElementById('m-mes').value, stageId: document.getElementById('m-stage').value, meta: n(document.getElementById('m-meta').value) });
      DB.closers.push(r.closer); DB.meses.push(r.mes);
      setTimeout(() => go(`#/closer/${r.closer.id}/${r.mes.id}/painel`), 0);
    });
}
function modalAbrirMes(cid) {
  const ms = mesesDoCloser(cid);
  const ult = ms[ms.length - 1];
  const sug = ult ? proxMes(ult.mes) : mesAtualISO();
  const stageSel = ult ? ult.stageId : DB.stages[0]?.id;
  const st = DB.stages.find(s => s.id === stageSel) || DB.stages[0];
  const aberto = ms.find(m => m.status === 'aberto');
  openModal(`<h2>Abrir novo mês</h2>
    ${aberto ? `<div class="call c-info">O mês <b>${mesLabel(aberto.mes)}</b> será fechado e ficará salvo no Histórico.</div>` : ''}
    <div class="form-grid mt16">
      <label class="f">Mês<input class="in" id="m-mes" type="month" value="${sug}"></label>
      <label class="f">Stage<select class="in" id="m-stage" onchange="syncMeta()">${stageOptions(st?.id)}</select></label>
    </div>
    <label class="f mt16">Meta do mês (R$)<input class="in" id="m-meta" type="number" step="any" value="${n(st?.meta)}"></label>
    <p class="sub mt8">O funil começa zerado.</p>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Abrir mês</button></div>`,
    async () => {
      const novo = await api('openMonth', { closerId: cid, mes: document.getElementById('m-mes').value, stageId: document.getElementById('m-stage').value, meta: n(document.getElementById('m-meta').value) });
      DB.meses.forEach(m => { if (m.closerId === cid && m.status === 'aberto') m.status = 'fechado'; });
      DB.meses.push(novo);
      setTimeout(() => go(`#/closer/${cid}/${novo.id}/painel`), 0);
    });
}
function modalEditarMes(mid) {
  const m = DB.meses.find(x => x.id === mid);
  openModal(`<h2>Editar ${mesLabel(m.mes)}</h2>
    <div class="form-grid">
      <label class="f">Stage<select class="in" id="e-stage">${stageOptions(m.stageId)}</select></label>
      <label class="f">Meta do mês (R$)<input class="in" id="e-meta" type="number" step="any" value="${n(m.meta)}"></label>
    </div>
    <p class="sub mt8">Trocar o stage aplica as regras atuais do stage escolhido a este mês.</p>
    <label class="f mt16">Status
      <select class="in" id="e-status"><option value="aberto" ${m.status === 'aberto' ? 'selected' : ''}>Aberto</option><option value="fechado" ${m.status === 'fechado' ? 'selected' : ''}>Fechado</option></select></label>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`,
    async () => {
      const srv = await api('updateMonth', { id: mid, stageId: document.getElementById('e-stage').value, meta: n(document.getElementById('e-meta').value), status: document.getElementById('e-status').value });
      if (srv.status === 'aberto') DB.meses.forEach(o => { if (o.closerId === srv.closerId && o.id !== srv.id && o.status === 'aberto') o.status = 'fechado'; });
      Object.assign(m, srv);
    });
}

/* =========================================================
   UTILITÁRIOS DE UI
   ========================================================= */
function openModal(html, onOk) {
  const el = document.getElementById('modal');
  el.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  const first = el.querySelector('input,select'); if (first) first.focus();
  const ok = el.querySelector('#ok');
  const run = async () => {
    ok.disabled = true; ok.textContent = 'Salvando…';
    try { await onOk(); closeModal(); toast('Salvo na planilha'); render(); }
    catch (e) { toast(e.message, true); ok.disabled = false; ok.textContent = 'Tentar de novo'; }
  };
  if (ok) ok.onclick = run;
  el.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter' && ok && !ok.disabled) run(); }));
}
function closeModal() { document.getElementById('modal').innerHTML = ''; }
let toastT;
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast ${err ? 'err' : ''}">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => el.innerHTML = '', err ? 5000 : 2200);
}
function confirmar(msg) { return window.confirm(msg); }
function afterRender() { ligarTooltip(); if (R.tab === 'vendas') { formaSel = 'pix'; } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* =========================================================
   INÍCIO
   ========================================================= */
(async function init() {
  try { await loadAll(); render(); }
  catch (e) {
    document.getElementById('app').innerHTML = `<div class="card empty" style="max-width:560px;margin:40px auto">
      <h2 style="color:var(--bad)">Não foi possível carregar a planilha</h2><p class="mt8">${esc(e.message)}</p>
      <button class="btn pri mt16" onclick="location.reload()">Tentar de novo</button></div>`;
  }
})();
// Atualiza dados a cada 60s quando ninguém está editando (para quem abre em outro computador)
setInterval(async () => {
  if (pending > 0 || document.getElementById('modal').innerHTML || document.activeElement?.tagName === 'INPUT') return;
  if (Object.values(filaFunil).some(q => q.delta)) return;
  try { await loadAll(); render(); } catch (e) {}
}, 60000);
</script>
