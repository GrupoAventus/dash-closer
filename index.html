<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dash Closer · Grupo Aventus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#060608; --surface:#0d0d10; --surface-2:#131318; --surface-3:#18181f;
  --line:#1e1e28; --line-2:#151520;
  --ink:#f0ede8; --ink-2:#9090a0; --ink-3:#3a3a4a;
  --accent:#FF6B1A; --accent-soft:#FF6B1A14; --accent-mid:#FF6B1A40; --accent-ink:#ff8c42; --on-accent:#fff;
  --good:#3ddc84; --good-soft:#3ddc8414; --warn:#f5c518; --warn-soft:#f5c51814; --bad:#ff4d6a; --bad-soft:#ff4d6a14;
  --black:#c0bfbb; --black-soft:#1a1a22;
  --glow:0 0 0 1px var(--accent-mid),0 8px 32px #FF6B1A14;
  --shadow:0 1px 3px #00000060,0 4px 16px #00000040;
  --shadow-lg:0 4px 24px #00000080,0 12px 40px #00000050;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.tnum{font-variant-numeric:tabular-nums}

/* ── TOP BAR ── */
.top{
  position:sticky;top:0;z-index:20;
  background:rgba(13,13,16,.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1280px;margin:0 auto;
  padding:0 24px;height:56px;
  display:flex;align-items:center;gap:20px;
}
.brand{
  display:flex;align-items:center;gap:11px;
  font-weight:900;letter-spacing:4px;font-size:17px;
}
.brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),#e55e10);
  color:#fff;display:grid;place-items:center;
  font-size:15px;font-weight:900;
  box-shadow:0 4px 14px #FF6B1A40;
}
.brand-name{color:var(--ink)}
.brand-name span{color:var(--accent);text-shadow:0 0 16px #FF6B1A70}
.brand small{font-weight:500;color:var(--ink-3);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;margin-left:2px}
.nav{display:flex;gap:3px;margin-left:auto}
.nav a{
  padding:7px 14px;border-radius:8px;
  font-weight:600;color:var(--ink-2);font-size:12.5px;
  transition:all .18s;letter-spacing:.3px;
}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{
  background:var(--accent-soft);color:var(--accent-ink);
  border:1px solid var(--accent-mid);
}
body.locked .nav, body.locked .adm-btn, body.locked .sync{display:none}

/* ── LOGIN ── */
.login{
  min-height:calc(100vh - 56px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,#FF6B1A08,transparent);
}
.login-card{
  width:100%;max-width:400px;
  background:rgba(13,13,16,.85);
  backdrop-filter:blur(24px);
  border:1px solid var(--line);
  border-radius:16px;padding:36px;
  box-shadow:var(--shadow-lg),0 0 0 1px #FF6B1A14;
  position:relative;overflow:hidden;
}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-mid),transparent);
}
.login-logo{
  text-align:center;margin-bottom:28px;
}
.login-logo-text{
  font-size:32px;font-weight:900;letter-spacing:7px;
  text-shadow:0 0 40px #FF6B1A30;
}
.login-logo-text span{color:var(--accent);text-shadow:0 0 20px #FF6B1A80}
.login-logo-sub{
  font-size:9px;color:var(--ink-3);letter-spacing:3.5px;
  text-transform:uppercase;margin-top:7px;font-weight:600;
}
.lembrar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-top:14px;cursor:pointer}
.lembrar input{accent-color:var(--accent);width:16px;height:16px}
.login-erro{color:var(--bad);font-size:12.5px;font-weight:600;min-height:20px;margin:10px 0 4px;text-align:center}
.adm-btn{
  border:1px solid var(--line);background:transparent;
  color:var(--ink-2);padding:7px 13px;border-radius:8px;
  font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;
  transition:all .18s;
}
.adm-btn:hover{border-color:var(--accent-mid);color:var(--ink)}
.adm-btn.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;box-shadow:0 0 6px var(--good)}
.sync.busy i{background:var(--warn);animation:pulse 1s infinite;box-shadow:0 0 6px var(--warn)}
@keyframes pulse{50%{opacity:.3}}

/* ── LAYOUT ── */
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
h2{font-size:15px;font-weight:700;letter-spacing:-.3px}
h3{font-size:13.5px;font-weight:700}
.sub{color:var(--ink-3);font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:760px){.g2{grid-template-columns:1fr}}
@media (max-width:520px){.g5{grid-template-columns:1fr}.nav a{padding:7px 9px}.brand small{display:none}.sync span{display:none}}

/* ── CARDS ── */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px;transition:border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:var(--r);
  background:linear-gradient(135deg,rgba(255,255,255,.02) 0%,transparent 60%);
  pointer-events:none;
}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}

/* ── SECTION TITLE ── */
.sec,.card h3.mt16{
  display:flex;align-items:center;gap:10px;
  font-size:8.5px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;color:var(--accent);
  margin:28px 0 14px;
}
.sec::before,.card h3.mt16::before{
  content:'';width:3px;height:12px;flex-shrink:0;
  background:linear-gradient(180deg,var(--accent),#FF6B1A60);
  border-radius:2px;box-shadow:0 0 8px #FF6B1A60;
}
.sec::after,.card h3.mt16::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* ── BUTTONS & INPUTS ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);
  padding:9px 15px;border-radius:9px;
  font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;
  transition:all .18s;
}
.btn:hover{background:var(--surface-2);border-color:var(--line)}
.btn.pri{
  background:linear-gradient(135deg,var(--accent),#e55e10);
  border-color:var(--accent);color:#fff;
  box-shadow:0 4px 16px #FF6B1A30;
}
.btn.pri:hover{box-shadow:0 6px 20px #FF6B1A50;transform:translateY(-1px)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--ink-3);padding:4px 7px;border-radius:6px;font-size:13px;transition:all .15s}
.icon-btn:hover{background:#ff4d6a14;color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.5px;text-transform:uppercase}
.in{
  border:1px solid var(--line);background:var(--surface);
  border-radius:9px;padding:9px 12px;font-size:13.5px;
  width:100%;outline:none;transition:border-color .18s,box-shadow .18s;
}
.in:focus{border-color:var(--accent-mid);box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface-2)}
.seg button{border:none;background:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2);transition:all .15s}
.seg button.on{background:linear-gradient(135deg,var(--accent),#e55e10);color:#fff;box-shadow:0 2px 8px #FF6B1A30}

/* ── TABS ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0;overflow-x:auto}
.tabs a{padding:10px 16px;font-weight:600;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .18s}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
.tabs a:hover{color:var(--ink-2)}

/* ── KPI ── */
.kpi .lbl{font-size:9px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:2px}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:7px}
.kpi .foot{font-size:12px;color:var(--ink-3);margin-top:5px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.3px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.kpi .badge{white-space:normal;line-height:1.3}
.b-verde{background:var(--good-soft);color:var(--good);border:1px solid #3ddc8428}
.b-yellow{background:var(--warn-soft);color:var(--warn);border:1px solid #f5c51828}
.b-red{background:var(--bad-soft);color:var(--bad);border:1px solid #ff4d6a28}
.b-desligado{background:var(--black-soft);color:var(--black);border:1px solid #ffffff14}
.b-neutro{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.b-aberto{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-mid)}

/* ── PROGRESS ── */
.prog{position:relative;height:12px;background:var(--surface-3);border-radius:999px;margin:34px 0 30px}
.prog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--accent),#ff9448);box-shadow:0 0 10px #FF6B1A50}
.prog .proj{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--ink-3)}
.prog .proj span{position:absolute;top:-22px;left:0;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.prog .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--surface)}
.prog .mk span{position:absolute;top:22px;left:1px;transform:translateX(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap;font-weight:600}

/* ── FUNNEL ── */
.fun{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.fun{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.fun{grid-template-columns:1fr}}
.fstep{
  border:1px solid var(--line);border-radius:12px;
  padding:16px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:10px;
  transition:border-color .2s,box-shadow .2s;
}
.fstep:hover{border-color:var(--accent-mid);box-shadow:0 0 20px #FF6B1A08}
.fstep .t{font-size:9px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:2px;display:flex;justify-content:space-between;gap:6px}
.fstep .n{font-size:36px;font-weight:800;letter-spacing:-.03em;text-align:center;cursor:text}
.fstep .ctr{display:flex;gap:8px}
.fstep .ctr button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer;user-select:none;transition:all .15s}
.fstep .ctr button:hover{border-color:var(--line)}
.fstep .ctr button.plus{background:linear-gradient(135deg,var(--accent),#e55e10);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px #FF6B1A30}
.fstep .ctr button:active{transform:scale(.95)}
.fstep .auto{font-size:12px;color:var(--ink-3);text-align:center;height:44px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:10px}
.fbar{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff9448);border-radius:999px;box-shadow:0 0 8px #FF6B1A40}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.rate{padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);transition:border-color .18s}
.rate:hover{border-color:var(--accent-mid)}
.rate b{font-size:19px;font-weight:800;display:block;letter-spacing:-.5px}
.rate span{font-size:11.5px;color:var(--ink-3)}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--ink-3);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle;transition:background .12s}
td.r,th.r{text-align:right}
tr:hover td{background:rgba(255,255,255,.01)}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:800;border-top:1px solid var(--line)}
tr.hl td{background:var(--accent-soft)}
.empty{padding:32px;text-align:center;color:var(--ink-3);letter-spacing:.5px}

/* ── CALLOUTS ── */
.call{border-radius:12px;padding:14px 16px;font-size:13px;border:1px solid transparent;position:relative}
.call b{font-weight:700}
.c-verde{background:var(--good-soft);border-color:#3ddc8428}
.c-yellow{background:var(--warn-soft);border-color:#f5c51828}
.c-red{background:var(--bad-soft);border-color:#ff4d6a28}
.c-desligado{background:var(--black-soft)}
.c-info{background:var(--accent-soft);border-color:var(--accent-mid)}

/* ── CLOSER CARDS ── */
.cc{display:block;transition:transform .18s,border-color .18s,box-shadow .18s}
.cc:hover{border-color:var(--accent-mid);transform:translateY(-2px);box-shadow:var(--glow)}
.cc .av{
  width:44px;height:44px;border-radius:12px;
  background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:800;font-size:16px;
  border:1px solid var(--accent-mid);
}
.mini{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin:14px 0 8px}
.mini i{display:block;height:100%;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.stats small{display:block;font-size:10px;color:var(--ink-3);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.stats b{font-size:14px;font-weight:800}

/* ── MODAL & TOAST ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(8px)}
.modal{
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;width:100%;max-width:480px;padding:26px;
  box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto;
  position:relative;
}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent-mid),transparent)}
.modal h2{margin-bottom:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--surface-2);color:var(--ink);
  padding:12px 20px;border-radius:12px;
  font-weight:600;font-size:13px;z-index:60;
  box-shadow:var(--shadow-lg);max-width:90vw;
  border:1px solid var(--line);backdrop-filter:blur(16px);
}
.toast.err{background:var(--bad-soft);color:var(--bad);border-color:#ff4d6a30}
.loading{display:grid;place-items:center;height:60vh;color:var(--ink-3);gap:12px;text-align:center}
.spin{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px;box-shadow:0 0 10px #FF6B1A20}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── CHART ── */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-size:12px;padding:8px 11px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.rules p{margin:6px 0;color:var(--ink-2)}
.rules ul{margin:6px 0 6px 18px;color:var(--ink-2)}
.rules li{margin:4px 0}
.kbd{font-weight:700;color:var(--ink)}
.pill-step{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.pill-step .num{width:26px;height:26px;flex:none;border-radius:8px;background:linear-gradient(135deg,var(--accent),#e55e10);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;box-shadow:0 2px 8px #FF6B1A30}
.muted{color:var(--ink-3)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
</style>
</head>
<body class="locked">
<header class="top"><div class="top-in">
  <a class="brand" href="#/">
    <span class="brand-mark">A</span>
    <span class="brand-name"><span>A</span>VENTUS <small>CLOSER</small></span>
  </a>
  <nav class="nav">
    <a href="#/" id="nav-closers">Closers</a>
    <a href="#/config" id="nav-config">Configurações</a>
  </nav>
  <button class="adm-btn" id="adm-btn" onclick="sair()">Sair</button>
  <div class="sync" id="sync"><i></i><span>Sincronizado</span></div>
</div></header>
<main class="wrap" id="app"><div class="loading"><div><div class="spin"></div>Carregando dados da planilha…</div></div></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =========================================================
   ESTADO E API
   ========================================================= */
const DB = { closers: [], stages: [], meses: [], vendas: [], descontos: [], taxas: [] };
let pending = 0;

/* ---------- Modo administrador ---------- */
const CHAVE = 'dashCloserAdmin';
let ADMIN = '';
try { ADMIN = sessionStorage.getItem(CHAVE) || localStorage.getItem(CHAVE) || ''; } catch (e) {}
function setAdmin(s, lembrar) {
  ADMIN = s || '';
  try {
    sessionStorage.removeItem(CHAVE); localStorage.removeItem(CHAVE);
    if (ADMIN) (lembrar ? localStorage : sessionStorage).setItem(CHAVE, ADMIN);
  } catch (e) {}
  atualizarBotaoAdmin();
}
function atualizarBotaoAdmin() {
  const b = document.getElementById('adm-btn'); if (!b) return;
  b.innerHTML = 'Sair';
  b.title = 'Sair do sistema';
}
function toggleAdmin() { sair(); }
function sair() {
  setAdmin('');
  Object.keys(DB).forEach(k => DB[k] = []);
  telaLogin();
}

/* ---------- Tela de login (antes de ver os closers) ---------- */

// Garante o formato AAAA-MM mesmo que a planilha tenha convertido o mês em data
function normMes(v) {
  const s = String(v ?? '').replace(/^'/, '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // 01/10/2026
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}`;
  const d = new Date(s);
  if (!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  return s;
}

/* =========================================================
   FORMATAÇÃO
   ========================================================= */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const n = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const brl = v => n(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = v => n(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const pct = (v, d = 1) => n(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const int = v => Math.round(n(v)).toLocaleString('pt-BR');
const dec = (v, d = 1) => n(v).toLocaleString('pt-BR', { maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mesLabel = m => { const [y, mo] = String(m).split('-'); return (MESES[Number(mo) - 1] || m) + '/' + y; };
const dataBR = d => { if (!d) return ''; const [y, m, dd] = String(d).slice(0, 10).split('-'); return `${dd}/${m}/${y}`; };
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const mesAtualISO = () => hojeISO().slice(0, 7);
const proxMes = m => { let [y, mo] = m.split('-').map(Number); mo++; if (mo > 12) { mo = 1; y++; } return `${y}-${String(mo).padStart(2, '0')}`; };
const parseMoney = s => { s = String(s || '').trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return n(parseFloat(s)); };
const initials = nome => String(nome).trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();

/* =========================================================
   REGRAS DE NEGÓCIO
   ========================================================= */
function comissaoPct(ating, p) {
  if (ating < n(p.gatilho)) return 0;
  return n(p.pctBase) + (ating - n(p.gatilho)) * n(p.incremento);
}
function comissaoValor(ating, p) { return n(p.variavel) * comissaoPct(ating, p) / 100; }

function diasDoMes(m) {
  m.mes = normMes(m.mes);
  const [y, mo] = m.mes.split('-').map(Number);
  const total = new Date(y, mo, 0).getDate();
  let passados;
  const atual = mesAtualISO();
  if (m.status === 'fechado' || m.mes < atual) passados = total;
  else if (m.mes > atual) passados = 0;
  else passados = new Date().getDate();
  return { total, passados, restantes: Math.max(0, total - passados) };
}

function vendasDoMes(id) { return DB.vendas.filter(v => v.mesId === id).sort((a, b) => String(b.data).localeCompare(String(a.data))); }
function descontosDoMes(id) { return DB.descontos.filter(v => v.mesId === id).sort((a, b) => String(b.data).localeCompare(String(a.data))); }
function mesesDoCloser(cid) { return DB.meses.filter(m => m.closerId === cid).sort((a, b) => a.mes.localeCompare(b.mes)); }

function ticketHistorico(cid) {
  const vs = DB.vendas.filter(v => v.closerId === cid);
  return vs.length ? vs.reduce((s, v) => s + n(v.valorLiquido), 0) / vs.length : 0;
}

function calcMes(m) {
  const vs = vendasDoMes(m.id), ds = descontosDoMes(m.id);
  const fatLiq = vs.reduce((s, v) => s + n(v.valorLiquido), 0);
  const fatBruto = vs.reduce((s, v) => s + n(v.valorBruto), 0);
  const qtd = vs.length;
  const meta = n(m.meta);
  const ating = meta > 0 ? fatLiq / meta * 100 : 0;
  const pctCom = comissaoPct(ating, m);
  const comBruta = comissaoValor(ating, m);
  const desc = ds.reduce((s, d) => s + n(d.valor), 0);
  const comLiq = comBruta - desc;
  const f = { leads: n(m.leads), agendadas: n(m.agendadas), noshow: n(m.noshow), feitas: n(m.feitas), vendas: qtd };
  const tx = {
    agendamento: f.leads ? f.agendadas / f.leads : null,
    noshow: f.agendadas ? f.noshow / f.agendadas : null,
    comparecimento: f.agendadas ? f.feitas / f.agendadas : null,
    fechamento: f.feitas ? f.vendas / f.feitas : null,
    leadVenda: f.leads ? f.vendas / f.leads : null
  };
  const ticket = qtd ? fatLiq / qtd : ticketHistorico(m.closerId);
  const dias = diasDoMes(m);

  // Projeção pelo ritmo atual (dias corridos)
  let proj = null;
  if (m.status === 'aberto' && dias.passados > 0 && dias.passados < dias.total) {
    const fator = dias.total / dias.passados;
    const fatP = fatLiq * fator;
    const atP = meta > 0 ? fatP / meta * 100 : 0;
    proj = {
      fator, fat: fatP, ating: atP, pctCom: comissaoPct(atP, m),
      comissao: comissaoValor(atP, m) - desc,
      funil: { leads: f.leads * fator, agendadas: f.agendadas * fator, noshow: f.noshow * fator, feitas: f.feitas * fator, vendas: f.vendas * fator }
    };
  }

  // O que falta para cada marco
  const marcos = [
    { nome: 'Gatilho da comissão', alvo: n(m.gatilho) },
    { nome: 'Recuperação de flag', alvo: n(m.recuperacao) },
    { nome: 'Meta cheia', alvo: 100 }
  ].filter((x, i, a) => a.findIndex(y => y.alvo === x.alvo) === i).sort((a, b) => a.alvo - b.alvo).map(mk => {
    const valorAlvo = meta * mk.alvo / 100;
    const falta = Math.max(0, valorAlvo - fatLiq);
    const vendasNec = ticket > 0 ? Math.ceil(falta / ticket) : null;
    const feitasNec = vendasNec != null && tx.fechamento ? Math.ceil(vendasNec / tx.fechamento) : null;
    const agendNec = feitasNec != null && tx.comparecimento ? Math.ceil(feitasNec / tx.comparecimento) : null;
    const leadsNec = agendNec != null && tx.agendamento ? Math.ceil(agendNec / tx.agendamento) : null;
    return { ...mk, valorAlvo, falta, porDia: dias.restantes > 0 ? falta / dias.restantes : null, vendasNec, feitasNec, agendNec, leadsNec, comissao: comissaoValor(mk.alvo, m) };
  });

  return { fatLiq, fatBruto, taxasCartao: fatBruto - fatLiq, qtd, meta, ating, pctCom, comBruta, desc, comLiq, remun: n(m.fixo) + comLiq, f, tx, ticket, dias, proj, marcos };
}

/* ---------- Flags ---------- */
const ESTADOS = {

  desligado: { nome: 'Desligamento', cls: 'desligado' }
};
function avaliar(entrada, a, p) {
  const red = n(p.redAbaixo), yel = n(p.yellowAbaixo), rec = n(p.recuperacao);
  switch (entrada) {
    case 'desligado': return { cls: 'desligado', label: 'Desligamento por baixa performance', next: 'desligado' };
    case 'yellowProg':
      return a >= rec ? { cls: 'verde', label: 'Saiu da Yellow Flag', next: 'normal' }
                      : { cls: 'red', label: `Red Flag (não bateu ${rec}% na Yellow)`, next: 'red1' };
    case 'red1':
      return a >= rec ? { cls: 'red', label: `Aceleração 1/2 cumprida`, next: 'red2' }
                      : { cls: 'desligado', label: 'Desligamento por baixa performance', next: 'desligado' };
    case 'red2':
      return a >= rec ? { cls: 'verde', label: 'Saiu da Red Flag', next: 'normal' }
                      : { cls: 'desligado', label: 'Desligamento por baixa performance', next: 'desligado' };
    default:
      if (a < red) return { cls: 'red', label: 'Red Flag', next: 'red1' };
      if (a < yel) return { cls: 'yellow', label: 'Yellow Flag', next: 'yellowProg' };
      return { cls: 'verde', label: 'Sem flag', next: 'normal' };
  }
}
function linhaDoTempo(cid) {
  let estado = 'normal';
  return mesesDoCloser(cid).map(m => {
    const c = calcMes(m);
    const entrada = estado;
    const aberto = m.status === 'aberto';
    const aAtual = c.ating;
    const aProj = c.proj ? c.proj.ating : c.ating;
    const resultado = avaliar(entrada, aberto ? aProj : aAtual, m);
    const atual = aberto ? avaliar(entrada, aAtual, m) : resultado;
    estado = resultado.next;
    return { m, c, entrada, aberto, resultado, atual };
  });
}
function exigencia(entrada, p) {

  switch (entrada) {
    case 'yellowProg': return `Está em <b>Yellow Flag</b>. Neste mês precisa bater <b>${rec}% da meta</b>. Se não bater, entra em <b>Red Flag</b>.`;
    case 'red1': return `Está em <b>Red Flag</b> (programa de aceleração, <b>mês 1 de 2</b>). Precisa bater <b>${rec}% da meta</b> neste mês e no próximo. Se não bater, é <b>desligado por baixa performance</b>.`;
    case 'red2': return `Está em <b>Red Flag</b> (programa de aceleração, <b>mês 2 de 2</b>). Precisa bater <b>${rec}% da meta</b> neste mês para sair da Red Flag. Se não bater, é <b>desligado por baixa performance</b>.`;
    case 'desligado': return `Não bateu ${rec}% durante o programa de aceleração: <b>desligamento por baixa performance</b>.`;
    default: return `Sem flag. Abaixo de <b>${red}%</b> da meta = Red Flag · entre <b>${red}% e ${yel}%</b> = Yellow Flag · a partir de <b>${yel}%</b> fica sem flag.`;
  }
}
// Mês aberto: mostra a flag em vigor (vinda dos meses anteriores). Mês fechado: o resultado do mês.
function situacaoBadge(it) {
  if (it.aberto) { const e = ESTADOS[it.entrada]; return `<span class="badge b-${e.cls}">${e.nome}</span>`; }
  return `<span class="badge b-${it.resultado.cls}">${esc(it.resultado.label)}</span>`;
}
function corAting(a, p) {
  if (a < n(p.redAbaixo)) return 'var(--bad)';
  if (a < n(p.yellowAbaixo)) return 'var(--warn)';
  return 'var(--good)';
}

let R = {};
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'config') return { page: 'config', tab: parts[1] || 'stages' };
  if (parts[0] === 'closer') return { page: 'closer', cid: parts[1], mid: parts[2], tab: parts[3] || 'painel' };
  return { page: 'home' };
}
function go(h) { location.hash = h; }
window.addEventListener('hashchange', () => { if (ADMIN && !document.body.classList.contains('locked')) render(); });

function render() {
  R = parseHash();
  document.getElementById('nav-closers').classList.toggle('on', R.page !== 'config');
  document.getElementById('nav-config').classList.toggle('on', R.page === 'config');
  const app = document.getElementById('app');
  if (R.page === 'config') app.innerHTML = viewConfig();
  else if (R.page === 'closer') app.innerHTML = viewCloser();
  else app.innerHTML = viewHome();
  afterRender();
}

/* ---------- Funil: +/- com gravação agrupada ---------- */
const filaFunil = {};
function bump(mesId, campo, delta) {
  const m = DB.meses.find(x => x.id === mesId);
  if (!m) return;
  const atual = n(m[campo]);
  if (atual + delta < 0) return;
  m[campo] = atual + delta;
  const key = mesId + '|' + campo;
  const q = filaFunil[key] || (filaFunil[key] = { delta: 0, t: null });
  q.delta += delta;
  clearTimeout(q.t);
  q.t = setTimeout(() => enviarFunil(mesId, campo), 700);
  const s = document.getElementById('sync');
  s.classList.add('busy'); s.querySelector('span').textContent = 'Salvando na planilha…';
  render();
}
async function enviarFunil(mesId, campo) {
  const key = mesId + '|' + campo;
  const q = filaFunil[key];
  if (!q || !q.delta) { setBusy(0); return; }
  const delta = q.delta; q.delta = 0;
  try {
    const srv = await api('incFunnel', { mesId, campo, delta });
    const m = DB.meses.find(x => x.id === mesId);
    if (m && !filaFunil[key].delta) { m[campo] = n(srv[campo]); render(); }
  } catch (e) {
    const m = DB.meses.find(x => x.id === mesId);
    if (m) m[campo] = Math.max(0, n(m[campo]) - delta);
    toast('Não foi possível salvar o funil: ' + e.message, true);
    render();
  }
}
function editarFunil(mesId, campo) {
  const m = DB.meses.find(x => x.id === mesId);
  const nomes = { leads: 'Leads', agendadas: 'Reuniões agendadas', noshow: 'No-show', feitas: 'Reuniões feitas' };
  openModal(`<h2>${nomes[campo]}</h2>
    <label class="f">Quantidade total no mês<input class="in" id="fv" type="number" min="0" value="${n(m[campo])}"></label>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`,
    async () => {
      const valor = Math.max(0, Math.round(n(document.getElementById('fv').value)));
      const srv = await api('setFunnel', { mesId, campo, valor });
      Object.assign(m, srv);
    });
}

let formaSel = 'pix';
function setForma(f) {
  formaSel = f;

function previewVenda() {
  const el = document.getElementById('v-prev'); if (!el) return;
  const v = parseMoney(document.getElementById('v-valor').value);
  if (!v) { el.textContent = 'Informe o valor para ver o líquido.'; return; }
  const t = formaSel === 'cartao' ? taxaDe(document.getElementById('v-parc').value) : 0;
  el.innerHTML = `Valor líquido que conta para a meta: <b style="color:var(--ink)">${brl(v * (1 - t / 100))}</b>${t ? ` (taxa ${pct(t, 2)} = −${brl(v * t / 100)})` : ' (Pix, sem taxa)'}`;
}
async function salvarVenda(mesId) {
  const valor = parseMoney(document.getElementById('v-valor').value);
  if (!valor) return toast('Informe o valor da venda', true);
  const payload = {
    mesId, data: document.getElementById('v-data').value, cliente: document.getElementById('v-cliente').value.trim(),
    produto: document.getElementById('v-produto').value.trim(), valorBruto: valor, forma: formaSel,
    parcelas: formaSel === 'cartao' ? n(document.getElementById('v-parc').value) : 1, obs: document.getElementById('v-obs').value.trim()
  };
  try { const v = await api('addSale', payload); DB.vendas.push(v); formaSel = 'pix'; toast('Venda salva'); render(); }
  catch (e) { toast(e.message, true); }
}
async function excluirVenda(id) {
  if (!confirmar('Excluir esta venda?')) return;
  try { await api('deleteSale', { id }); DB.vendas = DB.vendas.filter(v => v.id !== id); toast('Venda excluída'); render(); }
  catch (e) { toast(e.message, true); }
}

function tabHistorico(c, tl) {
  if (!tl.length) return `<div class="card empty">Sem meses.</div>`;

  tl.forEach(t => { totFat += t.c.fatLiq; totCom += t.c.comLiq; totRem += t.c.remun; });
  return `
  <div class="card">
    <div class="card-h"><h2>% da meta por mês</h2><span class="sub">Passe o mouse nas barras</span></div>
    ${graficoHistorico(tl)}
  </div>
  <div class="card mt16">
    <div class="card-h"><h2>Todos os meses</h2><span class="sub">Clique em um mês para abrir</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Mês</th><th>Stage</th><th class="r">Meta</th><th class="r">Faturado</th><th class="r">% meta</th><th class="r">Comissão</th><th class="r">Descontos</th><th class="r">Remuneração</th><th>Resultado</th></tr></thead>
      <tbody>${tl.slice().reverse().map(t => `<tr style="cursor:pointer" class="${t.m.id === R.mid ? 'hl' : ''}" onclick="go('#/closer/${c.id}/${t.m.id}/painel')">
        <td><b>${mesLabel(t.m.mes)}</b>${t.aberto ? ' <span class="badge b-aberto" style="margin-left:4px">aberto</span>' : ''}</td>
        <td>${esc(t.m.stageNome)}</td><td class="r tnum">${brl0(t.c.meta)}</td><td class="r tnum">${brl0(t.c.fatLiq)}</td>
        <td class="r tnum"><b style="color:${corAting(t.c.ating, t.m)}">${pct(t.c.ating)}</b></td>
        <td class="r tnum">${brl0(t.c.comBruta)}</td><td class="r tnum">${t.c.desc ? '−' + brl0(t.c.desc) : '—'}</td><td class="r tnum"><b>${brl0(t.c.remun)}</b></td>
        <td><span class="badge b-${t.aberto ? t.atual.cls : t.resultado.cls}">${esc(t.aberto ? t.atual.label + ' (parcial)' : t.resultado.label)}</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="r tnum">${brl0(totFat)}</td><td></td><td colspan="2"></td><td class="r tnum">${brl0(totRem)}</td><td></td></tr></tfoot>
    </table></div>
  </div>`;
}
function graficoHistorico(tl) {
  const W = 900, H = 260, pl = 44, pr = 10, pt = 16, pb = 36;
  const maxA = Math.max(120, ...tl.map(t => t.c.ating + 10));
  const top = Math.ceil(maxA / 20) * 20;
  const iw = W - pl - pr, ih = H - pt - pb;
  const bw = Math.min(56, iw / tl.length * 0.6);
  const y = v => pt + ih - (Math.min(v, top) / top) * ih;
  const p0 = tl[tl.length - 1].m;
  const refs = [[n(p0.redAbaixo), 'var(--bad)'], [n(p0.yellowAbaixo), 'var(--warn)'], [100, 'var(--ink-3)']];
  let grid = '';
  for (let v = 0; v <= top; v += 20) grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v}%</text>`;
  const bars = tl.map((t, i) => {
    const cx = pl + iw / tl.length * (i + 0.5);
    const a = t.c.ating, h = Math.max(0, y(0) - y(a));
    const cor = corAting(a, t.m);
    const r = Math.min(4, h);
    const x0 = cx - bw / 2, yTop = y(a);
    const path = h > 0 ? `M${x0},${y(0)} V${yTop + r} Q${x0},${yTop} ${x0 + r},${yTop} H${x0 + bw - r} Q${x0 + bw},${yTop} ${x0 + bw},${yTop + r} V${y(0)} Z` : '';
    const tip = `${mesLabel(t.m.mes)}|${pct(a)} da meta|${brl0(t.c.fatLiq)} faturado|Comissão ${brl0(t.c.comLiq)}|${t.aberto ? t.atual.label + ' (parcial)' : t.resultado.label}`;
    return `<g class="hb" data-tip="${esc(tip)}" data-x="${cx}" data-y="${yTop}">
      <rect x="${cx - iw / tl.length / 2}" y="${pt}" width="${iw / tl.length}" height="${ih}" fill="transparent"/>
      ${path ? `<path d="${path}" fill="${cor}" ${t.aberto ? 'fill-opacity=".55"' : ''}/>` : ''}
      <text x="${cx}" y="${H - pb + 18}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${MESES[Number(t.m.mes.slice(5)) - 1].slice(0, 3)}/${t.m.mes.slice(2, 4)}</text>
      ${tl.length <= 12 ? `<text x="${cx}" y="${yTop - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${pct(a, 0)}</text>` : ''}
    </g>`;
  }).join('');
  const lines = refs.map(([v, c]) => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="5 4"/>`).join('');
  return `<div class="chart" id="hchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Percentual da meta por mês">${grid}${lines}${bars}<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/></svg><div class="tip" id="htip" style="display:none"></div></div>
  <div class="legend"><span><i style="background:var(--good)"></i>Sem flag (≥ ${n(p0.yellowAbaixo)}%)</span><span><i style="background:var(--warn)"></i>Yellow (${n(p0.redAbaixo)}–${n(p0.yellowAbaixo)}%)</span><span><i style="background:var(--bad)"></i>Red (&lt; ${n(p0.redAbaixo)}%)</span><span><i style="background:var(--good);opacity:.55"></i>Mês aberto (parcial)</span></div>`;
}
function ligarTooltip() {
  const ch = document.getElementById('hchart'); if (!ch) return;
  const tip = document.getElementById('htip'), svg = ch.querySelector('svg');
  ch.querySelectorAll('.hb').forEach(g => {
    g.addEventListener('mouseenter', () => {
      const parts = g.dataset.tip.split('|');
      tip.innerHTML = `<b>${esc(parts[0])}</b><br>${parts.slice(1).map(esc).join('<br>')}`;
      const s = svg.getBoundingClientRect().width / 900;
      tip.style.left = (n(g.dataset.x) * s) + 'px'; tip.style.top = (n(g.dataset.y) * s) + 'px'; tip.style.display = 'block';
    });
    g.addEventListener('mouseleave', () => tip.style.display = 'none');
  });
}

  return `
  <div class="grid g2">
    <div class="card rules">
      <h2>Remuneração · ${esc(m.stageNome)}</h2>
      <p class="mt8">Fixo de <span class="kbd">${brl0(m.fixo)}</span> + variável de <span class="kbd">${brl0(m.variavel)}</span>. Meta do mês: <span class="kbd">${brl0(m.meta)}</span>.</p>
      <ul>
        <li>Abaixo de <b>${n(m.gatilho)}%</b> da meta não há comissão.</li>
        <li>Ao atingir <b>${n(m.gatilho)}%</b>, libera <b>${n(m.pctBase)}%</b> do variável.</li>

        <li>O % da meta é calculado sobre o <b>valor líquido</b> das vendas (já sem a taxa do cartão).</li>
        <li>Os valores da aba Descontos são abatidos da comissão do mês.</li>
      </ul>
      <div class="tbl-wrap mt16"><table>
        <thead><tr><th>% da meta</th><th class="r">Faturamento</th><th class="r">% do variável</th><th class="r">Comissão</th><th class="r">Total c/ fixo</th></tr></thead>
        <tbody>${niveis.map(a => `<tr><td><b>${a}%</b></td><td class="r tnum">${brl0(n(m.meta) * a / 100)}</td><td class="r tnum">${pct(comissaoPct(a, m))}</td><td class="r tnum"><b>${brl0(comissaoValor(a, m))}</b></td><td class="r tnum">${brl0(n(m.fixo) + comissaoValor(a, m))}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card rules">
      <h2>Flags de performance</h2>
      <div class="call c-yellow mt16"><b>Yellow Flag:</b> entre ${n(m.redAbaixo)}% e ${n(m.yellowAbaixo)}% da meta no mês. No mês seguinte precisa bater <b>${n(m.recuperacao)}%</b>. Se não bater, entra em Red Flag.</div>
      <div class="call c-red mt8"><b>Red Flag:</b> abaixo de ${n(m.redAbaixo)}% da meta (ou não recuperou a Yellow). Entra no <b>programa de aceleração</b> e precisa bater pelo menos <b>${n(m.recuperacao)}%</b> em <b>cada um dos 2 meses seguintes</b>.</div>
      <div class="call c-desligado mt8"><b>Desligamento:</b> se não bater ${n(m.recuperacao)}% em qualquer um dos 2 meses do programa de aceleração, é desligado por baixa performance.</div>
      <div class="call c-verde mt8"><b>Sem flag:</b> ${n(m.yellowAbaixo)}% ou mais da meta.</div>
      <h2 class="mt24">Onde cadastrar cada coisa</h2>
      <div class="grid mt16" style="gap:8px">
        <div class="pill-step"><span class="num">1</span><div><b>Painel do mês → Funil:</b> aperte <b>+</b> a cada lead, reunião agendada, no-show e reunião feita. Errou? Aperte <b>−</b> ou clique no número para digitar.</div></div>
        <div class="pill-step"><span class="num">2</span><div><b>Vendas:</b> cadastre cada venda com valor, Pix ou cartão e parcelas. A coluna "Vendas" do funil conta sozinha.</div></div>
        <div class="pill-step"><span class="num">3</span><div><b>Descontos:</b> lance os valores a abater da comissão.</div></div>
        <div class="pill-step"><span class="num">4</span><div><b>Fim do mês:</b> clique em <b>+ Abrir novo mês</b>, escolha o stage e a meta. O mês anterior é fechado e fica salvo no Histórico.</div></div>
      </div>
    </div>
  </div>
  <div class="card mt16">
    <div class="card-h"><h2>Taxas do cartão</h2><a class="btn sm" href="#/config/taxas">Editar taxas</a></div>

  const f = (k, l, extra = '') => `<label class="f">${l}<input class="in" id="s-${k}" type="number" step="any" value="${s[k]}" ${extra}></label>`;
  openModal(`<h2>${id ? 'Editar stage' : 'Novo stage'}</h2>
    <label class="f">Nome<input class="in" id="s-nome" value="${esc(s.nome)}" placeholder="Ex.: Stage 2"></label>

    <div class="form-grid mt8">${f('fixo', 'Fixo (R$)')}${f('variavel', 'Variável (R$)')}${f('meta', 'Meta padrão (R$)')}</div>
    <h3 class="mt16">Faixa de comissionamento</h3>
    <div class="form-grid mt8">${f('gatilho', 'Gatilho (% da meta)')}${f('pctBase', '% do variável no gatilho')}${f('incremento', 'p.p. por ponto acima')}</div>

    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Salvar stage</button></div>`,
    async () => {
      const p = { id, nome: document.getElementById('s-nome').value.trim() };
      ['fixo', 'variavel', 'meta', 'gatilho', 'pctBase', 'incremento', 'redAbaixo', 'yellowAbaixo', 'recuperacao'].forEach(k => p[k] = n(document.getElementById('s-' + k).value));
      if (!p.nome) throw new Error('Informe o nome');
      const srv = await api('saveStage', p);
      const i = DB.stages.findIndex(x => x.id === srv.id);
      if (i >= 0) DB.stages[i] = srv; else DB.stages.push(srv);
    });
}
async function excluirStage(id) {
  if (!confirmar('Excluir este stage?')) return;
  try { await api('deleteStage', { id }); DB.stages = DB.stages.filter(s => s.id !== id); render(); } catch (e) { toast(e.message, true); }
}
function cfgTaxas() {
  const lista = Array.from({ length: 12 }, (_, i) => i + 1);
  return `<div class="card" style="max-width:720px">
    <div class="card-h"><h2>Taxas do cartão por parcelamento</h2></div>
    <p class="sub">Percentual descontado do valor da venda no cartão. Vale para as próximas vendas cadastradas; vendas já cadastradas mantêm a taxa da época.</p>
    <div class="form-grid mt16" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
      ${lista.map(p => `<label class="f">${p}x (%)<input class="in tx-in" data-p="${p}" type="number" step="0.01" min="0" value="${taxaDe(p)}"></label>`).join('')}
    </div>
    <div class="row mt16" style="justify-content:flex-end"><button class="btn pri" onclick="salvarTaxas()">Salvar taxas</button></div>
  </div>`;
}
async function salvarTaxas() {
  const taxas = [...document.querySelectorAll('.tx-in')].map(i => ({ parcelas: n(i.dataset.p), taxa: n(i.value) }));
  try { DB.taxas = await api('saveTaxas', { taxas }); toast('Taxas salvas'); render(); } catch (e) { toast(e.message, true); }
}
function cfgClosers() {
  return `<div class="row between"><p class="sub">Renomear, inativar ou excluir closers.</p><button class="btn pri" onclick="modalNovoCloser()">+ Novo closer</button></div>
  <div class="card mt16">${DB.closers.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>Nome</th><th>Status</th><th class="r">Meses</th><th></th></tr></thead>
    <tbody>${DB.closers.map(c => `<tr><td><b>${esc(c.nome)}</b></td><td>${c.ativo === 'nao' ? '<span class="badge b-neutro">Inativo</span>' : '<span class="badge b-verde">Ativo</span>'}</td>
      <td class="r tnum">${mesesDoCloser(c.id).length}</td>
      <td class="r"><div class="row" style="gap:4px;justify-content:flex-end">
        <button class="btn sm" onclick="renomearCloser('${c.id}')">Renomear</button>
        <button class="btn sm" onclick="toggleCloser('${c.id}')">${c.ativo === 'nao' ? 'Reativar' : 'Inativar'}</button>
        <button class="btn sm danger" onclick="excluirCloser('${c.id}')">Excluir</button></div></td></tr>`).join('')}</tbody>
  </table></div>` : '<div class="empty">Nenhum closer.</div>'}</div>`;
}
function renomearCloser(id) {
  const c = DB.closers.find(x => x.id === id);
  openModal(`<h2>Renomear closer</h2><label class="f">Nome<input class="in" id="c-nome" value="${esc(c.nome)}"></label>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`,
    async () => { const srv = await api('updateCloser', { id, nome: document.getElementById('c-nome').value }); Object.assign(c, srv); });
}
async function toggleCloser(id) {
  const c = DB.closers.find(x => x.id === id);
  try { const srv = await api('updateCloser', { id, ativo: c.ativo === 'nao' ? 'sim' : 'nao' }); Object.assign(c, srv); render(); } catch (e) { toast(e.message, true); }
}
async function excluirCloser(id) {
  const c = DB.closers.find(x => x.id === id);
  if (!confirmar(`Excluir ${c.nome} e TODOS os meses, vendas e descontos dele? Isso não pode ser desfeito. Para só esconder, use "Inativar".`)) return;
  try {
    await api('deleteCloser', { id });
    DB.closers = DB.closers.filter(x => x.id !== id); DB.meses = DB.meses.filter(x => x.closerId !== id);
    DB.vendas = DB.vendas.filter(x => x.closerId !== id); DB.descontos = DB.descontos.filter(x => x.closerId !== id);
    toast('Closer excluído'); render();
  } catch (e) { toast(e.message, true); }
}

/* =========================================================
   MODAIS: closer e meses
   ========================================================= */
function stageOptions(sel) { return DB.stages.map(s => `<option value="${s.id}" data-meta="${n(s.meta)}" ${s.id === sel ? 'selected' : ''}>${esc(s.nome)} · meta ${brl0(s.meta)}</option>`).join(''); }
function syncMeta() { const o = document.getElementById('m-stage').selectedOptions[0]; if (o) document.getElementById('m-meta').value = o.dataset.meta; }

function modalNovoCloser() {
  if (!DB.stages.length) return toast('Cadastre um stage primeiro em Configurações', true);
  const s0 = DB.stages[0];
  openModal(`<h2>Novo closer</h2>
    <label class="f">Nome<input class="in" id="c-nome" placeholder="Nome do closer"></label>
    <div class="form-grid mt16">
      <label class="f">Mês inicial<input class="in" id="m-mes" type="month" value="${mesAtualISO()}"></label>
      <label class="f">Stage<select class="in" id="m-stage" onchange="syncMeta()">${stageOptions(s0.id)}</select></label>
    </div>
    <label class="f mt16">Meta do mês (R$)<input class="in" id="m-meta" type="number" step="any" value="${n(s0.meta)}"></label>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Cadastrar</button></div>`,
    async () => {
      const nome = document.getElementById('c-nome').value.trim();
      if (!nome) throw new Error('Informe o nome');
      const r = await api('createCloser', { nome, mes: document.getElementById('m-mes').value, stageId: document.getElementById('m-stage').value, meta: n(document.getElementById('m-meta').value) });
      DB.closers.push(r.closer); DB.meses.push(r.mes);
      setTimeout(() => go(`#/closer/${r.closer.id}/${r.mes.id}/painel`), 0);
    });
}
function modalAbrirMes(cid) {
  const ms = mesesDoCloser(cid);
  const ult = ms[ms.length - 1];
  const sug = ult ? proxMes(ult.mes) : mesAtualISO();
  const stageSel = ult ? ult.stageId : DB.stages[0]?.id;
  const st = DB.stages.find(s => s.id === stageSel) || DB.stages[0];
  const aberto = ms.find(m => m.status === 'aberto');
  openModal(`<h2>Abrir novo mês</h2>
    ${aberto ? `<div class="call c-info">O mês <b>${mesLabel(aberto.mes)}</b> será fechado e ficará salvo no Histórico.</div>` : ''}
    <div class="form-grid mt16">
      <label class="f">Mês<input class="in" id="m-mes" type="month" value="${sug}"></label>
      <label class="f">Stage<select class="in" id="m-stage" onchange="syncMeta()">${stageOptions(st?.id)}</select></label>
    </div>
    <label class="f mt16">Meta do mês (R$)<input class="in" id="m-meta" type="number" step="any" value="${n(st?.meta)}"></label>
    <p class="sub mt8">O funil começa zerado.</p>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Abrir mês</button></div>`,
    async () => {
      const novo = await api('openMonth', { closerId: cid, mes: document.getElementById('m-mes').value, stageId: document.getElementById('m-stage').value, meta: n(document.getElementById('m-meta').value) });
      DB.meses.forEach(m => { if (m.closerId === cid && m.status === 'aberto') m.status = 'fechado'; });
      DB.meses.push(novo);
      setTimeout(() => go(`#/closer/${cid}/${novo.id}/painel`), 0);
    });
}
function modalEditarMes(mid) {
  const m = DB.meses.find(x => x.id === mid);
  openModal(`<h2>Editar ${mesLabel(m.mes)}</h2>
    <div class="form-grid">
      <label class="f">Stage<select class="in" id="e-stage">${stageOptions(m.stageId)}</select></label>
      <label class="f">Meta do mês (R$)<input class="in" id="e-meta" type="number" step="any" value="${n(m.meta)}"></label>
    </div>
    <p class="sub mt8">Trocar o stage aplica as regras atuais do stage escolhido a este mês.</p>
    <label class="f mt16">Status
      <select class="in" id="e-status"><option value="aberto" ${m.status === 'aberto' ? 'selected' : ''}>Aberto</option><option value="fechado" ${m.status === 'fechado' ? 'selected' : ''}>Fechado</option></select></label>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`,
    async () => {
      const srv = await api('updateMonth', { id: mid, stageId: document.getElementById('e-stage').value, meta: n(document.getElementById('e-meta').value), status: document.getElementById('e-status').value });
      if (srv.status === 'aberto') DB.meses.forEach(o => { if (o.closerId === srv.closerId && o.id !== srv.id && o.status === 'aberto') o.status = 'fechado'; });
      Object.assign(m, srv);
    });
}

/* =========================================================
   UTILITÁRIOS DE UI
   ========================================================= */
function openModal(html, onOk, okMsg = 'Salvo na planilha') {
  const el = document.getElementById('modal');
  el.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  const first = el.querySelector('input,select'); if (first) first.focus();
  const ok = el.querySelector('#ok');
  const label = ok ? ok.textContent : '';
  const run = async () => {
    ok.disabled = true; ok.textContent = 'Aguarde…';
    try {
      await onOk(); closeModal();
      if (okMsg !== null) { toast(okMsg); render(); } // null = não re-renderiza (mantém formulários preenchidos)
    }
    catch (e) { toast(e.message, true); ok.disabled = false; ok.textContent = label; }
  };
  if (ok) ok.onclick = run;
  el.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter' && ok && !ok.disabled) run(); }));
}
function closeModal() { document.getElementById('modal').innerHTML = ''; }
let toastT;
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast ${err ? 'err' : ''}">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => el.innerHTML = '', err ? 5000 : 2200);
}
function confirmar(msg) { return window.confirm(msg); }
function afterRender() { ligarTooltip(); if (R.tab === 'vendas') { formaSel = 'pix'; } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* Funções protegidas: pedem a senha de administrador antes de abrir */
['modalNovoCloser', 'modalAbrirMes', 'modalEditarMes', 'modalStage', 'excluirStage', 'salvarTaxas',
 'renomearCloser', 'toggleCloser', 'excluirCloser', 'salvarDesconto', 'excluirDesconto'].forEach(nome => {
  const original = window[nome];
  window[nome] = (...args) => exigirAdmin(() => original(...args));
});

/* =========================================================
   INÍCIO
   ========================================================= */
atualizarBotaoAdmin();
async function iniciarApp() {
  document.body.classList.remove('locked');
  document.getElementById('app').innerHTML = `<div class="loading"><div><div class="spin"></div>Carregando dados da planilha…</div></div>`;
  try { await loadAll(); render(); }
  catch (e) {
    if (!ADMIN) return; // senha recusada: a tela de login já foi exibida
    document.getElementById('app').innerHTML = `<div class="card empty" style="max-width:560px;margin:40px auto">
      <h2 style="color:var(--bad)">Não foi possível carregar a planilha</h2><p class="mt8">${esc(e.message)}</p>
      <button class="btn pri mt16" onclick="location.reload()">Tentar de novo</button></div>`;
  }
}
if (ADMIN) iniciarApp(); else telaLogin();
// Atualiza dados a cada 60s quando ninguém está editando (para quem abre em outro computador)
setInterval(async () => {
  if (!ADMIN || document.body.classList.contains('locked')) return;
  if (pending > 0 || document.getElementById('modal').innerHTML || document.activeElement?.tagName === 'INPUT') return;
  if (Object.values(filaFunil).some(q => q.delta)) return;
  try { await loadAll(); render(); } catch (e) {}
}, 60000);
</script>
